name: TTYB
options:
  bundleIdPrefix: com.ttyb
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "5.9"

packages:
  SQLServerKit:
    path: vendor/sqlserver-nio

targets:
  TTYB:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 天天油报
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 用于直连加油站云数据库读取营业数据
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ttyb.mobile
        PRODUCT_NAME: TTYB
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        # 正式签名：自动签名，Team ID 由构建设置注入
        # （CI 传 APP_TEAM_ID=<TeamID>，见 .github/workflows/ios-testflight.yml；
        #   纯未签名构建由 ios-build.yml 用 CODE_SIGNING_ALLOWED=NO 覆盖，不受影响）
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(APP_TEAM_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: SQLServerKit
        product: SQLServerKit
