name: TTYB
options:
  bundleIdPrefix: com.ttyb
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

packages:
  SQLServerNIO:
    url: https://github.com/tashda/sqlserver-nio.git
    from: 0.1.0

targets:
  TTYB:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: 天天油报
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocalNetworkUsageDescription: 用于直连加油站云数据库读取营业数据
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ttyb.mobile
        PRODUCT_NAME: TTYB
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: SQLServerNIO
        product: SQLServerNIO
